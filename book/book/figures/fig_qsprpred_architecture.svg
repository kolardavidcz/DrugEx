<svg viewBox="0 0 840 260" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', sans-serif">
  <!-- Background -->
  <rect width="840" height="260" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Title -->
  <text x="420" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#f8fafc">
    End-to-End Architektura QSPRpred Orákula v DrugEx Prostředí
  </text>
  
  <!-- Step 1: Input Molecule -->
  <g transform="translate(30, 55)">
    <rect width="130" height="175" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#38bdf8">[1] VSTUP</text>
    <text x="65" y="44" text-anchor="middle" font-size="10" fill="#94a3b8">Kandidátní SMILES</text>
    
    <rect x="12" y="60" width="106" height="40" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="65" y="84" text-anchor="middle" font-family="monospace" font-size="9" fill="#38bdf8">c1ccc(O)cc1</text>
    
    <text x="65" y="125" text-anchor="middle" font-size="9.5" fill="#cbd5e1">MolVS Sanitace</text>
    <text x="65" y="142" text-anchor="middle" font-size="8.5" fill="#64748b">Desalinizace</text>
    <text x="65" y="157" text-anchor="middle" font-size="8.5" fill="#64748b">Tautomerní kanon.</text>
  </g>
  
  <!-- Arrow 1 -> 2 -->
  <line x1="165" y1="142" x2="190" y2="142" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Step 2: Featurization -->
  <g transform="translate(195, 55)">
    <rect width="135" height="175" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="67" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#818cf8">[2] FEATURIZACE</text>
    <text x="67" y="44" text-anchor="middle" font-size="10" fill="#94a3b8">Molekulární otisky</text>
    
    <rect x="12" y="60" width="111" height="50" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="67" y="80" text-anchor="middle" font-size="9" font-weight="bold" fill="#a5b4fc">Morgan Fingerprint</text>
    <text x="67" y="98" text-anchor="middle" font-family="monospace" font-size="8" fill="#818cf8">r=3, nBits=2048</text>
    
    <text x="67" y="132" text-anchor="middle" font-size="9.5" fill="#cbd5e1">Strukturní fragmenty</text>
    <text x="67" y="150" text-anchor="middle" font-size="8.5" fill="#64748b">Kruhové okolí atomů</text>
    <text x="67" y="165" text-anchor="middle" font-size="8.5" fill="#64748b">2048D bitvektor</text>
  </g>
  
  <!-- Arrow 2 -> 3 -->
  <line x1="335" y1="142" x2="360" y2="142" stroke="#818cf8" stroke-width="2"/>
  
  <!-- Step 3: ML Engine -->
  <g transform="translate(365, 55)">
    <rect width="140" height="175" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="70" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#34d399">[3] ML MODEL</text>
    <text x="70" y="44" text-anchor="middle" font-size="10" fill="#94a3b8">Predikce afinity</text>
    
    <rect x="12" y="60" width="116" height="50" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="80" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6ee7b7">Random Forest</text>
    <text x="70" y="96" text-anchor="middle" font-size="8.5" fill="#94a3b8">/ LightGBM / MLP</text>
    
    <text x="70" y="132" text-anchor="middle" font-size="9.5" fill="#cbd5e1">Kalibrace orákula</text>
    <text x="70" y="150" text-anchor="middle" font-size="8.5" fill="#64748b">pChEMBL / pIC50</text>
    <text x="70" y="165" text-anchor="middle" font-size="8.5" fill="#64748b">Odhad nejistoty σ</text>
  </g>
  
  <!-- Arrow 3 -> 4 -->
  <line x1="510" y1="142" x2="535" y2="142" stroke="#34d399" stroke-width="2"/>
  
  <!-- Step 4: Desirability Modifier -->
  <g transform="translate(540, 55)">
    <rect width="130" height="175" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#fbbf24">[4] MODIFIKÁTOR</text>
    <text x="65" y="44" text-anchor="middle" font-size="10" fill="#94a3b8">Desirability [0, 1]</text>
    
    <rect x="12" y="60" width="106" height="50" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="65" y="80" text-anchor="middle" font-size="9" font-weight="bold" fill="#fde047">SmoothClipped</text>
    <text x="65" y="98" text-anchor="middle" font-size="8" fill="#fbbf24">S(x) ∈ [0.0, 1.0]</text>
    
    <text x="65" y="132" text-anchor="middle" font-size="9.5" fill="#cbd5e1">Prahování bioaktivity</text>
    <text x="65" y="150" text-anchor="middle" font-size="8.5" fill="#64748b">Aktivní: pIC50 ≥ 6.5</text>
    <text x="65" y="165" text-anchor="middle" font-size="8.5" fill="#64748b">Hladký gradient dS/dx</text>
  </g>
  
  <!-- Arrow 4 -> 5 -->
  <line x1="675" y1="142" x2="700" y2="142" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Step 5: MORL Environment -->
  <g transform="translate(705, 55)">
    <rect width="105" height="175" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="52" y="24" text-anchor="middle" font-size="10" font-weight="bold" fill="#c084fc">[5] PROSTŘEDÍ</text>
    <text x="52" y="44" text-anchor="middle" font-size="9" fill="#94a3b8">DrugEx MORL</text>
    
    <rect x="8" y="60" width="89" height="50" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="52" y="80" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#d8b4fe">NSGA-II</text>
    <text x="52" y="96" text-anchor="middle" font-size="7.5" fill="#c084fc">Crowding Dist</text>
    
    <text x="52" y="132" text-anchor="middle" font-size="8.5" fill="#cbd5e1">Paretova fronta</text>
    <text x="52" y="150" text-anchor="middle" font-size="8" fill="#64748b">T_combo + QSPR</text>
    <text x="52" y="165" text-anchor="middle" font-size="8" fill="#64748b">Odměna R(X)</text>
  </g>
</svg>
