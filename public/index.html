<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>DrugEx Hub · De Novo Drug Design & ROCS Shape-Matching Workbench</title>
  <script>
    (function () {
      var t = localStorage.getItem("drugex-hub-theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/app/css/tokens.css" />
  <link rel="stylesheet" href="/app/css/shell.css" />
  <link rel="stylesheet" href="/app/css/lecture.css" />
  <link rel="stylesheet" href="/app/css/dojo.css" />
  <link rel="stylesheet" href="/app/css/quiz.css" />
  <link rel="stylesheet" href="/app/css/print.css" />
  <!-- 3Dmol.js for WebGL Molecular & Conformer Rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.4.2/3Dmol-min.js" defer></script>
</head>
<body>
  <div id="app">
    <!-- Titlebar -->
    <header class="titlebar" role="banner">
      <div class="titlebar-left">
        <div class="titlebar-dots" aria-hidden="true">
          <span class="r"></span><span class="y"></span><span class="g"></span>
        </div>
        <div class="titlebar-title">
          <strong>DrugEx Hub</strong>
          <span class="badge-pill">v3.4 · ROCS-Scoring</span>
          <span style="opacity: 0.6; font-size: 11px;">— Bakalářská Práce (VŠCHT Praha / ÚOCHB)</span>
        </div>
      </div>
      <div class="titlebar-actions">
        <button type="button" class="tb-btn" onclick="window.location.hash='#/thesis-guide'" title="Průvodce bakalářskou prací">🎓 Průvodce BP</button>
        <button type="button" class="tb-btn profile-btn" id="btnProfile" title="Student Profil">
          <span class="profile-dot"></span>
          <span id="userLabel">student</span>
        </button>
        <button type="button" class="tb-btn" id="btnTheme" title="Přepnout barevné schéma">🌓 Režim</button>
      </div>
    </header>

    <!-- Workbench -->
    <div class="workbench" id="workbench">
      <!-- Activity Bar -->
      <nav class="activitybar" aria-label="Activity bar">
        <button type="button" class="activity-btn active" data-view="explorer" title="Kurz & Přednášky" aria-label="Explorer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </button>
        <button type="button" class="activity-btn" data-view="progress" title="Plán & Statistika (Dashboard)" aria-label="Progress">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l3-4 3 2 4-6"/></svg>
        </button>
        <div class="activity-spacer"></div>
        <button type="button" class="activity-btn" id="btnSidebarToggle" title="Skrýt / Zobrazit panel (Ctrl+B)" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M9 4v16"/></svg>
        </button>
      </nav>

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar" aria-label="Sidebar">
        <div class="sidebar-header">
          <span>Obsah Výuky & Doja</span>
          <span style="font-size: 10px; color: var(--text-faint);">Ctrl+B</span>
        </div>

        <div class="filter-strip">
          <div class="filter-search">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
            <input type="search" id="filterText" placeholder="Hledat téma (např. 'ROCS', 'Pareto')..." autocomplete="off" spellcheck="false" />
          </div>
          <div class="filter-row" id="tagChips">
            <button type="button" class="chip" data-tag="Core">Core</button>
            <button type="button" class="chip" data-tag="WOW">WOW</button>
            <button type="button" class="chip" data-tag="Legendary">Legendary</button>
            <button type="button" class="chip" data-tag="Tricky">Tricky</button>
          </div>
        </div>

        <div class="sidebar-tree" id="sidebarTree"></div>
      </aside>

      <!-- Main Editor Area -->
      <main class="main-area" role="main">
        <!-- Breadcrumbs Tabbar -->
        <div class="tabbar">
          <div class="tabbar-breadcrumbs" id="breadcrumbs">
            <span>DrugEx Hub</span>
          </div>
          <div class="tabbar-controls">
            <button type="button" class="tabbar-btn" onclick="window.print()" title="Tisk studijního listu (Ctrl+P)">
              <span>🖨️</span> Tisknout
            </button>
          </div>
        </div>

        <!-- Dynamic Content Viewport -->
        <div class="content-viewport" id="contentViewport"></div>
      </main>
    </div>

    <!-- Status Bar -->
    <footer class="statusbar" role="contentinfo">
      <div class="statusbar-left">
        <div class="statusbar-item" onclick="window.location.hash='#/thesis-guide'">
          <span>🎓</span> Bakalářská práce: De Novo + ROCS
        </div>
        <div class="statusbar-item" onclick="window.location.hash='#/benchmark'">
          <span>📊</span> CCR2 Benchmark
        </div>
      </div>
      <div class="statusbar-right">
        <div class="statusbar-item">
          <span>⚡</span> Port 34100
        </div>
        <div class="statusbar-item">
          <span>Python 3.11</span>
        </div>
        <div class="statusbar-item">
          <span>PyTorch / RDKit / CDPKit</span>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="/app/js/app.js"></script>
</body>
</html>
