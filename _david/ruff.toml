target-version = "py310"
line-length = 120
extend-exclude = ["output"]

[lint]
# High-signal correctness and readability rules only; pedantic style-police rules
# (SIM, C4, RET, FURB, FLY, PTH, PERF, RUF) are intentionally omitted.
select = ["E", "F", "W", "B", "I", "UP", "PIE", "PLE"]
ignore = [
    "E501",  # long lines (error/log strings, tables, equations)
    "E402",  # imports after matplotlib.use() / sys.path setup
    "B905",  # don't require strict= on every zip()
    "B028",  # don't require stacklevel= on warnings.warn()
]

[lint.isort]
known-first-party = ["_david", "drugex"]

[format]
quote-style = "double"
indent-style = "space"
