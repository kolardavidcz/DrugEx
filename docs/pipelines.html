<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrugEx Pipeline Schemas & Architecture Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- React & Babel via CDN for zero-build instant execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Prism Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  
  <style>
    :root {
      --bg-page: #f8f9fa;
      --bg-card: #ffffff;
      --bg-sidebar: #f0f3f6;
      --bg-code: #f6f8fa;
      --bg-header: #002244;
      --bg-badge: #e2e8f0;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --text-header: #ffffff;
      --text-link: #006699;
      --text-link-hover: #004466;
      --border-main: #d1d5db;
      --border-subtle: #e5e7eb;
      --border-accent: #006699;
      --accent-cyan: #0284c7;
      --accent-teal: #0d9488;
      --accent-emerald: #16a34a;
      --accent-rose: #e11d48;
      --accent-amber: #d97706;
      --accent-purple: #7c3aed;
      --table-header: #eef2f7;
      --table-stripe: #f9fafb;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Consolas, monospace;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"] {
      --bg-page: #0b0f19;
      --bg-card: #111827;
      --bg-sidebar: #0e1422;
      --bg-code: #161f30;
      --bg-header: #070a12;
      --bg-badge: #1f293d;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --text-header: #f8fafc;
      --text-link: #38bdf8;
      --text-link-hover: #7dd3fc;
      --border-main: #1e293b;
      --border-subtle: #1e293b;
      --border-accent: #0284c7;
      --accent-cyan: #38bdf8;
      --accent-teal: #2dd4bf;
      --accent-emerald: #34d399;
      --accent-rose: #fb7185;
      --accent-amber: #fbbf24;
      --accent-purple: #a78bfa;
      --table-header: #172033;
      --table-stripe: #131c2e;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-main);
      font-size: 13.5px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--text-link); text-decoration: none; }
    a:hover { color: var(--text-link-hover); text-decoration: underline; }
    code, pre { font-family: var(--font-mono); }

    #root { display: flex; flex-direction: column; min-height: 100vh; }
    
    /* Top Header */
    .top-header {
      background: var(--bg-header);
      color: var(--text-header);
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 2px solid var(--border-accent);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-md);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
      text-decoration: none;
      color: inherit;
    }

    .brand-pill {
      background: linear-gradient(135deg, #0284c7, #0d9488);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-tab {
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .nav-tab:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      text-decoration: none;
    }

    .nav-tab.active {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .theme-toggle-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 8px;
    }

    /* Sub-header Breadcrumb Row */
    .search-bar-row {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .breadcrumbs {
      font-size: 12.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      overflow-x: auto;
      white-space: nowrap;
    }

    .breadcrumbs .current {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .breadcrumb-sep {
      color: var(--border-main);
      user-select: none;
    }

    .back-to-index-btn {
      background: var(--bg-page);
      border: 1px solid var(--border-main);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .back-to-index-btn:hover {
      background: var(--bg-card);
      border-color: var(--border-accent);
      color: var(--text-link);
      text-decoration: none;
    }

    /* Pipeline Schemas Styles */
    .schemas-container {
      flex: 1;
      padding: 16px 24px 48px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    .schemas-hero {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 6px;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .schemas-hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .schemas-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin: 0 0 4px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .schemas-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(2, 132, 199, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(2, 132, 199, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .schemas-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .schemas-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    .schema-tab-btn {
      background: var(--bg-page);
      border: 1px solid var(--border-main);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 4px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .schema-tab-btn:hover {
      border-color: var(--border-accent);
      color: var(--text-link);
      background: var(--bg-card);
    }

    .schema-tab-btn.active {
      background: var(--accent-cyan);
      color: #ffffff;
      border-color: var(--accent-cyan);
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.25);
    }

    .schema-tab-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.15);
      font-size: 10.5px;
      font-family: var(--font-mono);
      font-weight: 700;
    }

    .schema-tab-btn.active .schema-tab-num {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    /* Equation Chain Banner */
    .equation-chain-card {
      background: var(--bg-code);
      border: 1px solid var(--border-main);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 4px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }

    .diagram-equation-bar {
      background: var(--bg-code);
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .equation-bar-label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .equation-bar-terms {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .eq-pill {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 4px;
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .eq-pill:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .eq-pill.active {
      border-color: var(--accent-cyan);
      background: rgba(2, 132, 199, 0.12);
      color: var(--accent-cyan);
      box-shadow: 0 0 0 1px var(--accent-cyan);
    }

    /* Prism.js Syntax Tokens (GitHub Light default & VS Code Dark+) */
    .token.comment, .token.prolog, .token.doctype, .token.cdata { color: #6e7781; font-style: italic; }
    .token.punctuation { color: #24292f; }
    .token.property, .token.tag, .token.boolean, .token.number, .token.constant, .token.symbol { color: #0550ae; }
    .token.selector, .token.attr-name, .token.string, .token.char, .token.builtin { color: #0a3069; }
    .token.operator, .token.entity, .token.url { color: #24292f; }
    .token.atrule, .token.attr-value, .token.keyword { color: #cf222e; font-weight: 600; }
    .token.function { color: #8250df; }
    .token.class-name { color: #953800; font-weight: 600; }
    .token.regex, .token.important, .token.variable { color: #24292f; }

    [data-theme="dark"] .token.comment, [data-theme="dark"] .token.prolog, [data-theme="dark"] .token.doctype, [data-theme="dark"] .token.cdata { color: #6a9955; font-style: italic; }
    [data-theme="dark"] .token.punctuation { color: #d4d4d4; }
    [data-theme="dark"] .token.property, [data-theme="dark"] .token.tag, [data-theme="dark"] .token.boolean, [data-theme="dark"] .token.number, [data-theme="dark"] .token.constant, [data-theme="dark"] .token.symbol { color: #b5cea8; }
    [data-theme="dark"] .token.selector, [data-theme="dark"] .token.attr-name, [data-theme="dark"] .token.string, [data-theme="dark"] .token.char, [data-theme="dark"] .token.builtin { color: #ce9178; }
    [data-theme="dark"] .token.operator, [data-theme="dark"] .token.entity, [data-theme="dark"] .token.url { color: #d4d4d4; }
    [data-theme="dark"] .token.atrule, [data-theme="dark"] .token.attr-value, [data-theme="dark"] .token.keyword { color: #569cd6; font-weight: 500; }
    [data-theme="dark"] .token.function { color: #dcdcaa; }
    [data-theme="dark"] .token.class-name { color: #4ec9b0; }
    [data-theme="dark"] .token.regex, [data-theme="dark"] .token.important, [data-theme="dark"] .token.variable { color: #9cdcfe; }

    .equation-chain-label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .equation-chain-scroll {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 6px;
      scrollbar-width: thin;
    }

    .eq-chip {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 4px;
      padding: 5px 11px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .eq-chip:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      transform: translateY(-1px);
    }

    .eq-chip.active {
      border-color: var(--accent-cyan);
      background: rgba(2, 132, 199, 0.12);
      color: var(--accent-cyan);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }

    .eq-chip-tag {
      font-size: 9.5px;
      padding: 1px 5px;
      border-radius: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .eq-tag-input { background: rgba(13, 148, 136, 0.15); color: var(--accent-teal); }
    .eq-tag-agent { background: rgba(2, 132, 199, 0.15); color: var(--accent-cyan); }
    .eq-tag-scorer { background: rgba(217, 119, 6, 0.15); color: var(--accent-amber); }
    .eq-tag-modifier { background: rgba(124, 58, 237, 0.15); color: var(--accent-purple); }
    .eq-tag-env { background: rgba(22, 163, 74, 0.15); color: var(--accent-emerald); }
    .eq-tag-pareto { background: rgba(225, 29, 72, 0.15); color: var(--accent-rose); }
    .eq-tag-filter { background: rgba(234, 88, 12, 0.15); color: #ea580c; }
    .eq-tag-output { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); }

    .eq-op {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 2px;
      user-select: none;
    }

    /* Diagram Canvas */
    .diagram-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 6px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .diagram-panel-header {
      background: var(--bg-code);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .diagram-panel-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .diagram-panel-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--text-muted);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .diagram-svg-wrap {
      width: 100%;
      overflow-x: auto;
      padding: 18px 12px;
      background: var(--bg-card);
      scrollbar-width: thin;
      box-sizing: border-box;
    }

    .diagram-svg {
      min-width: 1000px;
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
    }

    .svg-node {
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .svg-node:hover {
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    .svg-node.selected rect.node-box {
      stroke: var(--accent-cyan) !important;
      stroke-width: 2.5px !important;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.45));
    }

    /* Node Inspector Section */
    .node-inspector-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 1024px) {
      .node-inspector-grid {
        grid-template-columns: 1fr;
      }
    }

    .inspector-card {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 6px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .inspector-header {
      background: var(--bg-code);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .inspector-stage-tag {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 3px;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    .inspector-body {
      padding: 18px 20px;
    }

    .inspector-formula-box {
      background: var(--bg-code);
      border: 1px solid var(--border-main);
      border-left: 3px solid var(--accent-cyan);
      border-radius: 4px;
      padding: 10px 14px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--text-main);
      margin-bottom: 16px;
      line-height: 1.5;
      overflow-x: auto;
    }

    .contract-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .contract-grid {
        grid-template-columns: 1fr;
      }
    }

    .contract-box {
      background: var(--bg-page);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 10px 12px;
    }

    .contract-box-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .contract-box-val {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-main);
      word-break: break-all;
    }

    .symbols-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .symbol-chip-link {
      background: var(--bg-page);
      border: 1px solid var(--border-main);
      border-radius: 3px;
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-link);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      display: inline-block;
    }

    .symbol-chip-link:hover {
      background: var(--bg-card);
      border-color: var(--border-accent);
      color: var(--text-link-hover);
      text-decoration: underline;
    }

    .param-pill-list {
      list-style: none;
      margin: 8px 0 0 0;
      padding: 0;
    }

    .param-pill-list li {
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px dashed var(--border-subtle);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .param-pill-list li:last-child {
      border-bottom: none;
    }

    .diag-notes-box {
      background: rgba(217, 119, 6, 0.08);
      border-left: 3px solid var(--accent-amber);
      padding: 10px 14px;
      border-radius: 0 4px 4px 0;
      margin-top: 14px;
      font-size: 12.5px;
      line-height: 1.5;
    }

    .flow-steps-rail {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 24px;
      scrollbar-width: thin;
    }

    .flow-step-card {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 6px;
      min-width: 220px;
      max-width: 250px;
      flex-shrink: 0;
      padding: 12px;

        "06": `# GraphTransformer dynamic valence masking at each bond creation step\n# Masks chemically forbidden valencies (e.g. pentavalent carbon) with -inf\nlogits = graph_transformer(mol_state)\nmasked_logits = logits + dynamic_valence_mask(mol_state)\naction = torch.argmax(masked_logits, dim=-1)`,
        "07": `from rdkit.Chem.BRICS import BRICSBuild\n\n# Verify synthetic compatibility between synthon exit vectors and linkers\ncompatible_pairs = [p for p in candidate_pairs if is_brics_compatible(p[0], p[1])]`,
        "08": `from drugex.training.scorers import LigandEfficiency, LipophilicEfficiency\n\n# Score reassembled drug candidates for Ligand Efficiency (LE / LipE)\nle_scorer = LigandEfficiency(qsar_scorer=target_qsar)\nlipe_scorer = LipophilicEfficiency(qsar_scorer=target_qsar)\nle_scores = le_scorer(assembled_mols)`
      },
      telemetry: {
        "01": `# Rollout fresh candidate batch from policy network\nbatch_smiles = agent.sample(batch_size=1024, temperature=0.8)\nprint(f"Sampled rollout batch size: {len(batch_smiles)}")`,
        "02": `from drugex.training.scorers import SmilesChecker\n\n# Q1 Filter: Chemical and syntactic valency verification (V >= 95%)\nvalid_smiles = [s for s in batch_smiles if SmilesChecker.checkSmiles(s)]\nvalidity_rate = len(valid_smiles) / len(batch_smiles)\nassert validity_rate >= 0.95, f"Validity dropped: {validity_rate:.2%}"`,
        "03": `# Q2 Filter: Batch and historical uniqueness to prevent mode collapse (U >= 85%)\nunique_smiles = set(valid_smiles)\nuniqueness_rate = len(unique_smiles) / len(valid_smiles)\nassert uniqueness_rate >= 0.85, f"Mode collapse warning: {uniqueness_rate:.2%}"`,
        "04": `from drugex.training.scorers import SAScore, RingSizePenalizer\n\n# Q3 Filter: Screen synthetic accessibility (SA <= 3.5) and strained rings\nsa_scorer = SAScore()\nsa_scores = sa_scorer(list(unique_smiles))\nfeasible_synthesis = [s for s, sa in zip(unique_smiles, sa_scores) if sa <= 3.5]`,
        "05": `# Q4 Filter: Desired Ratio (percentage of molecules meeting all objectives)\npassed_mols = env.getDesiredMolecules(feasible_synthesis)\ndesired_ratio = len(passed_mols) / len(feasible_synthesis)\nprint(f"Desired Ratio (Dr%): {desired_ratio:.2%}")`,
        "06": `from drugex.training.environment import DrugExEnvironment\n\n# Q5 Metric: Pairwise internal Tanimoto diversity of the candidate batch\ndiversity = env.calculateBatchDiversity(passed_mols)\nprint(f"Population internal diversity: {diversity:.3f}")`,
        "07": `from drugex.training.monitors import FileMonitor\n\n# Real-time epoch telemetry logging\nmonitor = FileMonitor(log_dir="experiments/run_01")\nmonitor.logEpoch(epoch=epoch, validity=validity_rate, uniqueness=uniqueness_rate, dr=desired_ratio)`,
        "08": `# Adaptive exploration: boost mutation probability epsilon if diversity falls\nif uniqueness_rate < 0.80:\n    explorer.epsilon = min(0.3, explorer.epsilon * 1.25)\n    print("Telemetry alert: Increased exploration epsilon to", explorer.epsilon)`
      }
    };

    function getStepCodeSnippet(pipelineId, stepLabel) {
      return STEP_CODE_SNIPPETS[pipelineId]?.[stepLabel] || `# Step ${stepLabel} in ${pipelineId}`;
    }

    function PipelineSchemasView({ pipelineId, onSelectPipeline, onSelectSymbol, onGoToMain }) {
      const [selectedNodeIdx, setSelectedNodeIdx] = useState(0);
      const [copiedSpec, setCopiedSpec] = useState(false);
      const [copiedSnippet, setCopiedSnippet] = useState(false);
      const [activeSubTab, setActiveSubTab] = useState("diagram");

      const pipeline = useMemo(() => {
        return PIPELINE_SCHEMAS.find(p => p.id === pipelineId) || PIPELINE_SCHEMAS[0];
      }, [pipelineId]);

      useEffect(() => {
        setSelectedNodeIdx(0);
      }, [pipelineId]);

      useEffect(() => {
        if (window.Prism) {
          setTimeout(() => window.Prism.highlightAll(), 50);
        }
      }, [selectedNodeIdx, pipelineId, activeSubTab]);

      const selectedNode = pipeline.nodes[selectedNodeIdx] || pipeline.nodes[0];

      const copyPipelineSpec = () => {
        const text = `Pipeline: ${pipeline.title}\nFormula: ${pipeline.formulaText}\nSummary: ${pipeline.summary}\nSteps:\n` +
          pipeline.matrixRows.map(r => `  Step ${r.step} [${r.component}]: ${r.operation} -> ${r.output} (${r.classes})`).join("\n");
        navigator.clipboard.writeText(text);
        setCopiedSpec(true);
        setTimeout(() => setCopiedSpec(false), 2000);
      };

      const copySnippet = (codeText) => {
        navigator.clipboard.writeText(codeText);
        setCopiedSnippet(true);
        setTimeout(() => setCopiedSnippet(false), 2000);
      };

      return (
        <div className="schemas-container">
          <div className="schemas-hero">
            <div className="schemas-hero-top">
              <div>
                <h1 className="schemas-title">
                  <span>{pipeline.title}</span>
                  <span className="schemas-badge">DrugEx v3.4 Architecture Schema</span>
                </h1>
                <div style={{ color: "var(--accent-cyan)", fontFamily: "var(--font-mono)", fontSize: "12px", fontWeight: 600, marginTop: "2px" }}>
                  {pipeline.tagline}
                </div>
              </div>
              <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>
                <button
                  className="copy-btn"
                  onClick={copyPipelineSpec}
                  title="Copy full pipeline specification to clipboard"
                  style={{ padding: "6px 12px", fontSize: "12px" }}
                >
                  {copiedSpec ? "Copied Specification!" : "Copy Pipeline Spec"}
                </button>
                <button
                  className="back-to-index-btn"
                  onClick={onGoToMain}
                  title="Return to Main Reference Index"
                  style={{ padding: "6px 12px", fontSize: "12px" }}

                  Main Index
                </button>
              </div>
            </div>
            <p className="schemas-subtitle">{pipeline.summary}</p>

            <div className="schemas-tabs" style={{ marginBottom: 0, borderBottom: "none", paddingBottom: 0 }}>
              {PIPELINE_SCHEMAS.map((p, idx) => {
                const isActive = p.id === pipeline.id;
                return (
                  <button
                    key={p.id}
                    className={`schema-tab-btn ${isActive ? "active" : ""}`}
                    onClick={() => onSelectPipeline(p.id)}
                    title={p.title}
                  >
                    <span className="schema-tab-num">{idx + 1}</span>
                    <span>{p.shortTitle}</span>
                  </button>
                );
              })}
            </div>
          </div>

          <div style={{ display: "flex", gap: "8px", marginBottom: "14px", alignItems: "center" }}>
            <button
              className={`schema-tab-btn ${activeSubTab === "diagram" ? "active" : ""}`}
              onClick={() => setActiveSubTab("diagram")}
              style={{ fontSize: "12px", padding: "5px 12px" }}
            >
              Interactive Visual Flowchart
            </button>
            <button
              className={`schema-tab-btn ${activeSubTab === "matrix" ? "active" : ""}`}
              onClick={() => setActiveSubTab("matrix")}
              style={{ fontSize: "12px", padding: "5px 12px" }}

          </div>

                  <div className="diagram-panel-title">

                    <span>{pipeline.title}</span>
                  </div>
                  <div className="diagram-panel-legend">

                    <span className="legend-item"><span className="legend-dot" style={{ background: "#0284c7" }}></span> Model / Agent</span>
                    <span className="legend-item"><span className="legend-dot" style={{ background: "#d97706" }}></span> Scorer Array</span>
                    <span className="legend-item"><span className="legend-dot" style={{ background: "#7c3aed" }}></span> Modifier</span>
                    <span className="legend-item"><span className="legend-dot" style={{ background: "#16a34a" }}></span> Environment</span>
                    <span className="legend-item"><span className="legend-dot" style={{ background: "#e11d48" }}></span> Pareto Selection</span>
                    <span className="legend-item"><span className="legend-dot" style={{ background: "#ea580c" }}></span> Filter Gate</span>
                  </div>
                </div>

                  <span className="equation-bar-label">Algebraic Chain:</span>

                        <button

                          <span className={`eq-chip-tag eq-tag-${item.tag || "agent"}`}>

                </div>

                        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
                      </marker>
                      <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

                      </marker>
                      <marker id="arrow-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

                      </marker>
                      <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

                        <line

                          x1={c.fromX}

                          x2={c.toX}

                          markerEnd={marker}
                        />

                    })}

                    {pipeline.feedbackLoop && (
                      <g>
                        <path
                          d={`M ${pipeline.feedbackLoop.fromX} ${pipeline.feedbackLoop.fromY} C ${pipeline.feedbackLoop.fromX - 35} 171, ${pipeline.feedbackLoop.toX - 35} 171, ${pipeline.feedbackLoop.toX} ${pipeline.feedbackLoop.toY}`}
                          fill="none"
                          stroke={pipeline.feedbackLoop.color || "var(--accent-cyan)"}
                          strokeWidth="2"
                          strokeDasharray="4,3"
                          markerEnd="url(#arrow-head)"
                        />
                      </g>
                    )}

                    {pipeline.nodes.map((n, idx) => {
                      const isSelected = idx === selectedNodeIdx;
                      const stageColor = getStageColor(n.stageType);
                      return (
                        <g
                          key={`node-${idx}`}
                          className={`svg-node ${isSelected ? "selected" : ""}`}
                          onClick={() => setSelectedNodeIdx(idx)}
                        >
                          <rect
                            className="node-box"
                            x={n.x}
                            y={n.y}
                            width="220"
                            height="98"
                            rx="6"
                            ry="6"
                            fill="var(--bg-card)"
                            stroke={isSelected ? "var(--accent-cyan)" : "var(--border-main)"}
                            strokeWidth={isSelected ? "2.5" : "1.2"}
                          />
                          <rect
                            x={n.x}
                            y={n.y}
                            width="220"
                            height="24"
                            rx="5"
                            ry="5"
                            fill={stageColor}
                          />
                          <rect
                            x={n.x}
                            y={n.y + 18}
                            width="220"
                            height="6"
                            fill={stageColor}
                          />
                          <text
                            x={n.x + 8}
                            y={n.y + 16}
                            fill="#ffffff"
                            fontSize="10.5"
                            fontFamily="var(--font-mono)"
                            fontWeight="700"
                          >
                            [{n.stepLabel}]
                          </text>
                          <text
                            x={n.x + 212}
                            y={n.y + 16}
                            fill="#ffffff"
                            fontSize="9"
                            textAnchor="end"
                            fontFamily="var(--font-mono)"
                            fontWeight="700"
                            letterSpacing="0.04em"
                          >
                            {n.stage.toUpperCase()}
                          </text>
                          <text
                            x={n.x + 10}
                            y={n.y + 44}
                            fill="var(--text-main)"
                            fontSize="11.5"
                            fontFamily="var(--font-sans)"
                            fontWeight="700"
                          >
                            {truncateStr(n.label, 26)}
                          </text>
                          <text
                            x={n.x + 10}
                            y={n.y + 59}
                            fill="var(--text-muted)"
                            fontSize="10"
                            fontFamily="var(--font-sans)"
                          >
                            {truncateStr(n.sublabel, 30)}
                          </text>
                          <rect
                            x={n.x + 8}
                            y={n.y + 68}
                            width="204"
                            height="21"
                            rx="3"
                            ry="3"
                            fill="var(--bg-code)"
                            stroke="var(--border-subtle)"
                            strokeWidth="1"
                          />
                          <text
                            x={n.x + 12}
                            y={n.y + 83}
                            fill="var(--accent-cyan)"
                            fontSize="9.5"
                            fontFamily="var(--font-mono)"
                            fontWeight="600"
                          >
                            {truncateStr(n.formula, 28)}
                          </text>
                        </g>
                      );
                    })}

                    {pipeline.connectors.map((c, cIdx) => {
                      if (!c.label) return null;
                      const midX = (c.fromX + c.toX) / 2;
                      const midY = (c.fromY + c.toY) / 2;
                      const labelWidth = Math.min(68, c.label.length * 6.2 + 10);
                      return (
                        <g key={`lbl-${cIdx}`}>
                          <rect
                            x={midX - labelWidth / 2}
                            y={midY - 7}
                            width={labelWidth}
                            height="15"
                            rx="3"
                            ry="3"
                            fill="var(--bg-card)"
                            stroke="var(--border-subtle)"
                            strokeWidth="0.8"
                          />
                          <text
                            x={midX}
                            y={midY + 3.5}
                            textAnchor="middle"
                            fill="var(--text-muted)"
                            fontSize="9"
                            fontFamily="var(--font-mono)"
                            fontWeight="600"
                          >
                            {c.label}
                          </text>
                        </g>
                      );
                    })}

                    {pipeline.feedbackLoop && pipeline.feedbackLoop.label && (
                      <g>
                        <rect
                          x={pipeline.feedbackLoop.fromX - 35 - 75}
                          y={163}
                          width="150"
                          height="16"
                          rx="3"
                          ry="3"
                          fill="var(--bg-card)"
                          stroke="var(--border-subtle)"
                          strokeWidth="0.8"
                        />
                        <text
                          x={pipeline.feedbackLoop.fromX - 35}
                          y={174.5}
                          textAnchor="middle"
                          fill="var(--accent-cyan)"
                          fontSize="9"
                          fontFamily="var(--font-mono)"
                          fontWeight="700"
                        >
                          {pipeline.feedbackLoop.label}
                        </text>
                      </g>
                    )}
                  </svg>
                </div>
              </div>

              {/* Selected Node Deep Inspector Grid */}
              <div className="node-inspector-grid">
                {/* Left Card: Core Logic, Contracts & Executable Python Implementation */}
                <div className="inspector-card">
                  <div className="inspector-header">
                    <div>
                      <span style={{ fontSize: "11px", fontFamily: "var(--font-mono)", color: "var(--text-muted)", marginRight: "8px" }}>
                        Step {selectedNode.stepLabel} of {pipeline.nodes.length}
                      </span>
                      <strong style={{ fontSize: "14px", color: "var(--text-main)" }}>
                        {selectedNode.label}
                      </strong>
                    </div>
                    <span
                      className="inspector-stage-tag"
                      style={{
                        background: `${getStageColor(selectedNode.stageType)}22`,
                        color: getStageColor(selectedNode.stageType)
                      }}
                    >
                      {selectedNode.stage}
                    </span>
                  </div>
                  <div className="inspector-body">
                    <div style={{ fontSize: "11px", fontWeight: 700, color: "var(--text-muted)", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: "4px" }}>
                      Mathematical Transformation / Law:
                    </div>
                    <div className="inspector-formula-box">
                      {selectedNode.formula}
                    </div>

                    <div className="contract-grid">
                      <div className="contract-box">
                        <div className="contract-box-title">Input Contract</div>
                        <div className="contract-box-val">{selectedNode.inputContract}</div>
                      </div>
                      <div className="contract-box">
                        <div className="contract-box-title">Output Contract</div>
                        <div className="contract-box-val">{selectedNode.outputContract}</div>
                      </div>
                    </div>

                    <div style={{ fontSize: "11px", fontWeight: 700, color: "var(--text-muted)", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: "4px" }}>
                      Component Behavior &amp; Execution Semantics:
                    </div>
                    <p style={{ fontSize: "13px", lineHeight: "1.55", color: "var(--text-main)", margin: 0 }}>
                      {selectedNode.description}
                    </p>

                    {selectedNode.diagnostics && (
                      <div className="diag-notes-box">
                        <strong>Engineering &amp; Diagnostics Note:</strong> {selectedNode.diagnostics}
                      </div>
                    )}

                    {/* Concrete Python Implementation Demonstration */}
                    <div style={{ marginTop: "16px" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "6px" }}>
                        <span style={{ fontSize: "11px", fontWeight: 700, color: "var(--text-muted)", textTransform: "uppercase", letterSpacing: "0.04em" }}>
                          Executable Python Implementation:
                        </span>
                        <button
                          className="copy-btn"
                          onClick={() => copySnippet(getStepCodeSnippet(pipeline.id, selectedNode.stepLabel))}
                          title="Copy Python code snippet"
                          style={{ padding: "3px 9px", fontSize: "11px" }}
                        >
                          {copiedSnippet ? "Copied Snippet!" : "Copy Code"}
                        </button>
                      </div>
                      <pre className="code-content language-python" style={{ margin: 0, padding: "12px 14px", borderRadius: "4px", fontSize: "11.5px", background: "var(--bg-code)", border: "1px solid var(--border-main)", overflowX: "auto" }}>
                        <code className="language-python">
                          {getStepCodeSnippet(pipeline.id, selectedNode.stepLabel)}

                    </div>
                  </div>
                </div>

                {/* Right Card: DrugEx Symbols, Hyperparameters & Pager */}
                <div className="inspector-card">
                  <div className="inspector-header">
                    <strong style={{ fontSize: "12.5px", color: "var(--text-main)" }}>
                      Implementation &amp; Symbols
                    </strong>
                    <span style={{ fontSize: "11px", color: "var(--accent-cyan)", fontFamily: "var(--font-mono)" }}>
                      v3.4 APIs
                    </span>
                  </div>
                  <div className="inspector-body">
                    <div style={{ fontSize: "11px", fontWeight: 700, color: "var(--text-muted)", textTransform: "uppercase", letterSpacing: "0.04em" }}>

                    </div>
                    <div className="symbols-list">

                          key={sym}
                          href={`index.html#${sym}`}

                          title={`Open reference documentation for ${sym}`}

                    <div style={{ fontSize: "11px", fontWeight: 700, color: "var(--text-muted)", textTransform: "uppercase", letterSpacing: "0.04em", marginTop: "16px" }}>

                    </div>
                    <ul className="param-pill-list">
                      {selectedNode.keyParameters.map(p => (
                        <li key={p.name}>
                          <span style={{ fontFamily: "var(--font-mono)", fontWeight: 600, color: "var(--accent-cyan)" }}>{p.name}</span>
                          <span style={{ color: "var(--text-muted)" }}>{p.desc}</span>

                    </ul>

                    <div style={{ marginTop: "20px", paddingTop: "14px", borderTop: "1px solid var(--border-subtle)", display: "flex", justifyContent: "space-between", alignItems: "center", gap: "8px" }}>
                      <button
                        className="back-to-index-btn"
                        disabled={selectedNodeIdx === 0}
                        onClick={() => setSelectedNodeIdx(i => Math.max(0, i - 1))}
                        style={{ opacity: selectedNodeIdx === 0 ? 0.4 : 1, cursor: selectedNodeIdx === 0 ? "not-allowed" : "pointer", padding: "4px 10px" }}
                        title="Navigate to previous pipeline step"
                      >
                        ← Step {pipeline.nodes[Math.max(0, selectedNodeIdx - 1)].stepLabel}
                      </button>
                      <span style={{ fontSize: "11px", color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>
                        Step {selectedNodeIdx + 1} / {pipeline.nodes.length}
                      </span>
                      <button
                        className="back-to-index-btn"
                        disabled={selectedNodeIdx === pipeline.nodes.length - 1}
                        onClick={() => setSelectedNodeIdx(i => Math.min(pipeline.nodes.length - 1, i + 1))}
                        style={{ opacity: selectedNodeIdx === pipeline.nodes.length - 1 ? 0.4 : 1, cursor: selectedNodeIdx === pipeline.nodes.length - 1 ? "not-allowed" : "pointer", padding: "4px 10px" }}
                        title="Navigate to next pipeline step"
                      >
                        Step {pipeline.nodes[Math.min(pipeline.nodes.length - 1, selectedNodeIdx + 1)].stepLabel} →
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="inspector-card" style={{ marginBottom: "24px" }}>
              <div className="inspector-header">
                <strong style={{ fontSize: "13.5px", color: "var(--text-main)" }}>
                  {pipeline.title} — Component Chaining Matrix
                </strong>
                <span style={{ fontSize: "11.5px", color: "var(--text-muted)" }}>
                  Authentic Standard Library Specification
                </span>
              </div>
              <div style={{ padding: "16px", overflowX: "auto" }}>
                <table className="ref-table" style={{ margin: 0 }}>
                  <thead>
                    <tr>
                      <th style={{ width: "6%" }}>Step</th>
                      <th style={{ width: "16%" }}>Stage / Component</th>
                      <th style={{ width: "22%" }}>Input Contract</th>
                      <th style={{ width: "26%" }}>Operation / Law</th>
                      <th style={{ width: "16%" }}>Output Contract</th>
                      <th style={{ width: "14%" }}>Classes</th>
                    </tr>
                  </thead>
                  <tbody>
                    {pipeline.matrixRows.map(row => (
                      <tr key={row.step}>
                        <td className="code-cell" style={{ fontWeight: 700 }}>{row.step}</td>
                        <td style={{ fontWeight: 600, color: "var(--text-main)" }}>{row.component}</td>
                        <td style={{ fontFamily: "var(--font-mono)", fontSize: "11.5px", color: "var(--text-muted)" }}>{row.input}</td>
                        <td style={{ fontFamily: "var(--font-mono)", fontSize: "11.5px" }}>{row.operation}</td>
                        <td style={{ fontFamily: "var(--font-mono)", fontSize: "11.5px", color: "var(--text-muted)" }}>{row.output}</td>
                        <td style={{ fontSize: "11.5px" }}>{row.classes}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    function StandalonePipelinesApp() {
      const [theme, setTheme] = useState("light");
      const [activePipelineId, setActivePipelineId] = useState(() => {
        const hash = window.location.hash.replace("#", "");
        if (hash && ["morl", "training", "rocs", "fragment", "telemetry"].includes(hash)) return hash;
        return "morl";
      });

      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
      }, [theme]);

      useEffect(() => {
        const handleHash = () => {
          const hash = window.location.hash.replace("#", "");
          if (hash && ["morl", "training", "rocs", "fragment", "telemetry"].includes(hash)) {
            setActivePipelineId(hash);
          }
        };
        window.addEventListener("hashchange", handleHash);
        return () => window.removeEventListener("hashchange", handleHash);
      }, []);

      const selectPipeline = (id) => {
        setActivePipelineId(id);
        window.location.hash = id;
      };

      const currentPipeline = PIPELINE_SCHEMAS.find(p => p.id === activePipelineId) || PIPELINE_SCHEMAS[0];

      return (
        <div>
          <header className="top-header">
            <a href="index.html" className="brand-title" title="Return to DrugEx Reference Platform">
              <span style={{ color: "#38bdf8", fontFamily: "var(--font-mono)", fontSize: "16px" }}>[D]</span>
              <span>DrugEx Architecture &amp; Pipeline Schemas</span>
              <span className="brand-pill">v3.4 Standard Workflows</span>
            </a>

            <div className="header-nav">
              <a href="index.html" className="back-to-index-btn" style={{ padding: "5px 12px", fontSize: "12px" }}>
                ← API Reference (234 Symbols)
              </a>
              <button 
                className="theme-toggle-btn"
                onClick={() => setTheme(t => t === "light" ? "dark" : "light")}
                title="Toggle Dark / Paper Theme"
              >
                {theme === "light" ? "Dark Theme" : "Paper Theme"}
              </button>
            </div>
          </header>

          <div className="search-bar-row">
            <div className="breadcrumbs">
              <a href="index.html" className="back-to-index-btn" style={{ marginRight: "10px" }}>
                ← API Reference
              </a>
              <a href="index.html" style={{ color: "var(--text-link)", fontWeight: 600 }}>DrugEx Reference</a>
              <span className="breadcrumb-sep">&gt;</span>
              <span style={{ fontWeight: 700, color: "var(--text-main)" }}>Architecture Schemas</span>
              <span className="breadcrumb-sep">&gt;</span>
              <span className="current">{currentPipeline.shortTitle}</span>
            </div>
          </div>

          <PipelineSchemasView
            pipelineId={activePipelineId}
            onSelectPipeline={selectPipeline}
            onSelectSymbol={(sym) => {
              window.location.href = `index.html#${sym}`;
            }}
            onGoToMain={() => {
              window.location.href = "index.html#main";
            }}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<StandalonePipelinesApp />);
  </script>
</body>
</html>
