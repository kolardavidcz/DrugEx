  <path d="M 22 14 C 15 14 11 20 11 27 C 11 32 14 36 17 38 C 13 41 12 47 14 52 C 16 57 22 59 27 57 C 30 55 31 52 32 49 C 33 52 34 55 37 57 C 42 59 48 57 50 52 C 52 47 51 41 47 38 C 50 36 53 32 53 27 C 53 20 49 14 42 14 C 37 14 34 18 32 21 C 30 18 27 14 22 14 Z" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linejoin="round" />

